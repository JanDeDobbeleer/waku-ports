# waku key bindings (whkd syntax) for Start12. Start12 does not tile windows, so there are no tiler
# keys here; add them from another port's keys.conf if you want them.
#
# wakukeys puts its own folder first in the PATH of each command it runs, so wakuc.exe next to
# wakukeys.exe is found without editing the PATH.
#
# The bare Windows key cannot be bound (the shell owns it), so the Start menu opens on Ctrl+Escape,
# the other key Windows has always had for it.

.shell cmd

# Reload the shell
alt + shift + o         : waku:reload

# Open or close the Start menu
ctrl + escape           : wakuc surface toggle startmenu
