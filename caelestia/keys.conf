# waku key bindings (whkd syntax). The keys drive waku's
# built-in tiler (`wakuc tile ...`) and the Windows virtual desktops (`wakuc desktop ...`).
#
# Every command starts `wakuc`. wakukeys puts its own folder first in the PATH of each command it
# runs, so wakuc.exe next to wakukeys.exe is found without editing the PATH. The keys daemon runs
# each command in cmd.exe, which starts faster than PowerShell. The tiler must be on (Tiling.enabled in your shell).
#
# Not bound, because waku has no equivalent:
#   toggle-maximize (alt + shift + f)
#   toggle-shortcuts (alt + i)
#   reload of this file (alt + o): the keys daemon watches the file and reloads it on a change

.shell cmd

# Reload the shell
alt + shift + o         : waku:reload

# Open a new Windows Terminal window
alt + t                 : start "" wt

alt + q                 : wakuc tile close
alt + m                 : wakuc tile minimize

# Focus windows
alt + left              : wakuc tile focus left
alt + down              : wakuc tile focus down
alt + up                : wakuc tile focus up
alt + right             : wakuc tile focus right
alt + shift + oem_4     : wakuc tile focus previous # oem_4 is [
alt + shift + oem_6     : wakuc tile focus next # oem_6 is ]

# Move windows
alt + shift + left      : wakuc tile move left
alt + shift + down      : wakuc tile move down
alt + shift + up        : wakuc tile move up
alt + shift + right     : wakuc tile move right
alt + shift + return    : wakuc tile promote

# Stack windows: several windows share one slot, the top one shows
ctrl + alt + shift + left  : wakuc tile stack left
ctrl + alt + shift + down  : wakuc tile stack down
ctrl + alt + shift + up    : wakuc tile stack up
ctrl + alt + shift + right : wakuc tile stack right
alt + oem_1             : wakuc tile unstack # oem_1 is ;
alt + oem_4             : wakuc tile cycle-stack previous # oem_4 is [
alt + oem_6             : wakuc tile cycle-stack next # oem_6 is ]

# Resize
alt + oem_plus          : wakuc tile resize horizontal increase
alt + oem_minus         : wakuc tile resize horizontal decrease
alt + shift + oem_plus  : wakuc tile resize vertical increase
alt + shift + oem_minus : wakuc tile resize vertical decrease

# Manipulate windows
alt + f                 : wakuc tile toggle
alt + shift + m         : wakuc tile monocle

# Tiler options
alt + shift + r         : wakuc tile retile
alt + p                 : wakuc tile pause

# Layouts
alt + x                 : wakuc tile flip horizontal
alt + y                 : wakuc tile flip vertical
alt + l                 : wakuc tile layout next

# Virtual desktops
ctrl + alt + left       : wakuc desktop previous
ctrl + alt + right      : wakuc desktop next

alt + 1                 : wakuc desktop goto 1
alt + 2                 : wakuc desktop goto 2
alt + 3                 : wakuc desktop goto 3
alt + 4                 : wakuc desktop goto 4
alt + 5                 : wakuc desktop goto 5
alt + 6                 : wakuc desktop goto 6
alt + 7                 : wakuc desktop goto 7
alt + 8                 : wakuc desktop goto 8
alt + 9                 : wakuc desktop goto 9

# Move the focused window to a desktop; the window leaves, the view stays. A number past the last
# desktop makes one new desktop (the next) and puts the window there.
alt + shift + 1         : wakuc desktop move 1
alt + shift + 2         : wakuc desktop move 2
alt + shift + 3         : wakuc desktop move 3
alt + shift + 4         : wakuc desktop move 4
alt + shift + 5         : wakuc desktop move 5
alt + shift + 6         : wakuc desktop move 6
alt + shift + 7         : wakuc desktop move 7
alt + shift + 8         : wakuc desktop move 8
alt + shift + 9         : wakuc desktop move 9
